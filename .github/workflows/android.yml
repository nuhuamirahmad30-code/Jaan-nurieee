name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3

      - name: Install (auto-find package.json)
        run: |
          PKG=$(find . -name "package.json" -not -path "*/node_modules/*" | head -1)
          echo "Found $PKG"
          DIR=$(dirname "$PKG")
          echo "DIR=$DIR"
          cd "$DIR"
          npm install
          echo "DIR=$DIR" >> $GITHUB_ENV

      - name: Add Android
        run: |
          DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -1))
          cd "$DIR"
          npx cap add android || true

      - name: Copy web
        run: |
          DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -1))
          cd "$DIR"
          npx cap copy android

      - name: Build APK
        run: |
          DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -1))
          cd "$DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaanNurie-FULL-GAME-FIXED
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
